name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --workspace @ha-plus/ui --dry-run

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.16.6
      - run: ruff check packages/frontend/ha_plus_frontend
      - run: ruff format --check packages/frontend/ha_plus_frontend
      - run: npm test --workspace @ha-plus/frontend
      - run: npm pack --workspace @ha-plus/frontend --dry-run
